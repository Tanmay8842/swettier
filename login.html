<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SHWETATTIRE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>SHWETATTIRE</h1>
                    <p>Fashion Store ERP System</p>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="register.html" class="nav-link">Register</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 2rem;">Login to Your Account</h2>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-large">
                        Login
                    </button>
                </form>

                <p style="text-align: center; margin-top: 1.5rem;">
                    Don't have an account? <a href="register.html">Register here</a>
                </p>

                <p style="text-align: center; margin-top: 1rem;">
                    <a href="admin\admin-login.html">Admin Login</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SHWETATTIRE. All rights reserved.</p>
        </div>
    </footer>

    <!-- 🔥 Firebase Login Script -->
    <script type="module">
        import {
            auth,
            signInWithEmailAndPassword
        } from "./js/firebase-auth.js";

        const form = document.getElementById("login-form");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    // Phase-1 admin rule
                    if (user.email === "admin@shwetattire.com") {
                        localStorage.setItem("role", "admin");
                        window.location.href = "admin/dashboard.html";
                    } else {
                        localStorage.setItem("role", "user");
                        window.location.href = "index.html";
                    }
                })
                .catch(() => {
                    alert("Invalid email or password");
                });
        });
    </script>

</body>
</html>
