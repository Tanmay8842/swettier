<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - SHWETATTIRE Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <h1>SHWETATTIRE</h1>
                <p>Admin Dashboard</p>
            </div>
            <nav class="nav">
                <a href="../index.html" class="nav-link">Store</a>
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="orders.html" class="nav-link">Orders</a>
                <a href="analytics.html" class="nav-link">Analytics</a>
                <a href="#" id="logout-btn" class="btn btn-secondary">Logout</a>
            </nav>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="main">
    <div class="container">
        <h2 class="section-title" id="form-title">Add New Product</h2>

        <div class="form-container" style="max-width:700px;">
            <form id="product-form">

                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="product-name" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="product-description" required></textarea>
                </div>

                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="product-price" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="product-stock" min="0" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="product-category" required>
                        <option value="">Select Category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="product-image" required>
                </div>

                <div style="display:flex;gap:1rem;">
                    <button type="submit" class="btn btn-primary btn-large">
                        Save Product
                    </button>
                    <a href="products.html" class="btn btn-secondary btn-large">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p>&copy; 2024 SHWETATTIRE. All rights reserved.</p>
    </div>
</footer>

<!-- Admin Page Logic -->
<script src="../js/data/products.js"></script>
<script src="../js/data/categories.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // Load categories
    const categories = getStorageData("categories", []);
    const categorySelect = document.getElementById("product-category");

    categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat.name;
        option.textContent = cat.name;
        categorySelect.appendChild(option);
    });

    // Edit mode
    const params = new URLSearchParams(window.location.search);
    if (params.get("id")) {
        document.getElementById("form-title").textContent = "Edit Product";
    }

    if (typeof initializeAddProduct === "function") {
        initializeAddProduct();
    }
});
</script>

<!-- 🔥 Firebase Logout -->
<script type="module">
import { auth, signOut } from "../js/firebase-auth.js";

document.getElementById("logout-btn").addEventListener("click", function () {
    signOut(auth).then(() => {
        localStorage.clear();
        window.location.href = "../login.html";
    });
});
</script>

<!-- 🔐 ADMIN GUARD (MUST BE LAST) -->
<script type="module" src="../js/admin-guard.js"></script>

</body>
</html>
