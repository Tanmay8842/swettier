<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SHWETATTIRE</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>SHWETATTIRE</h1>
                    <p>Fashion Store ERP System</p>
                </div>
                <nav class="nav">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="cart.html" class="nav-link active">
                        Cart <span class="cart-count">0</span>
                    </a>
                    <a href="wishlist.html" class="nav-link">Wishlist</a>
                    <a href="orders.html" class="nav-link">My Orders</a>
                    <a href="admin/dashboard.html" id="admin-link" class="nav-link" style="display: none;">Admin</a>
                    <a href="login.html" id="login-btn" class="btn btn-primary">Login</a>
                    <a href="#" id="logout-btn" onclick="logout()" class="btn btn-secondary" style="display: none;">Logout</a>
                    <span id="user-info" class="user-info" style="display: none;"></span>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <h2 class="section-title">Shopping Cart</h2>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                <div id="cart-container" class="cart-container">
                    <!-- Cart items will be loaded here -->
                </div>
                <div id="cart-total">
                    <!-- Cart total will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SHWETATTIRE. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data/users.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Override cart functions to refresh display on this page
        const originalUpdateCartQuantity = updateCartQuantity;
        const originalRemoveFromCart = removeFromCart;
        
        window.updateCartQuantity = function(productId, quantity) {
            const result = originalUpdateCartQuantity(productId, quantity);
            if (window.displayCart) window.displayCart();
            return result;
        };

        window.removeFromCart = function(productId) {
            originalRemoveFromCart(productId);
            if (window.displayCart) window.displayCart();
        };
    </script>
    <script type="module" src="js/auth-state.js"></script>

</body>
</html>
